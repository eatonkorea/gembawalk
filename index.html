  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = 'https://script.google.com/macros/s/AKfycbzFdKGv4zEmwZCJchBWrYand0gYneWFVR2Y1aen0Ir4-xq3rvNy107Qkh21lejUXfS9/exec';

    function GembaWalk() {
      const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
      const [activeTab, setActiveTab] = useState('action');
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);

      const [isSaving, setIsSaving] = useState(false);
      const [savingMessage, setSavingMessage] = useState(''); // 팝업 메시지
      const [uploadProgress, setUploadProgress] = useState({ uploaded: 0, total: 0, show: false });
      const [adminPw, setAdminPw] = useState('eaton12!@');
      
      // 테이블 필터
      const [mainFilters, setMainFilters] = useState({ supervisor: '', department: '', manager: '', status: '' });
      const [actionFilters, setActionFilters] = useState({ supervisor: '', manager: '', status: '' });
      
      // 화면 크기 감지
      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth <= 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      
      const [supervisors, setSupervisors] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [managers, setManagers] = useState({});
      const [admins, setAdmins] = useState([]);  // 관리자 목록 [{name, email}, ...]
      const [issues, setIssues] = useState([]);
      
      // 초기 데이터 로드
      useEffect(() => {
        loadAllData();
      }, []);
      
      const loadAllData = async () => {
        setIsLoading(true);
        try {
          const response = await fetch(API_URL + '?action=getAll');
          const data = await response.json();
          
          if (data.departments && data.departments.length > 0) {
            setDepartments(data.departments);
          }
          if (data.managers) {
            setManagers(data.managers);
          }
          if (data.admins) {
            setAdmins(data.admins);
          }
          if (data.supervisors && data.supervisors.length > 0) {
            setSupervisors(data.supervisors);
          }
          if (data.issues) {
            setIssues(data.issues);
          }
          if (data.settings) {
            if (data.settings.monthlyDetails) {
              setMonthlyDetails(data.settings.monthlyDetails);
            }
            if (data.settings.adminPassword) {
              setAdminPw(data.settings.adminPassword);
            }
          }
        } catch (error) {
          console.error('데이터 로드 실패:', error);
          alert('데이터를 불러오는데 실패했습니다. 페이지를 새로고침해주세요.');
        }
        setIsLoading(false);
      };
      
      // 날짜 포맷 함수 (ISO → YYYY-MM-DD)
      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        // 이미 YYYY-MM-DD 형식이면 그대로 반환
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
        // ISO 형식이면 앞 10자리만 추출
        if (dateStr.includes('T')) return dateStr.split('T')[0];
        // Date 객체로 변환 시도
        try {
          const d = new Date(dateStr);
          return d.toISOString().split('T')[0];
        } catch {
          return dateStr;
        }
      };
      
      // 이미지 리사이즈 함수 (최대 1200px, 품질 80%)
      const resizeImage = (file, maxSize = 1200, quality = 0.8) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              
              // 리사이즈 필요 여부 확인
              if (width > maxSize || height > maxSize) {
                if (width > height) {
                  height = Math.round((height * maxSize) / width);
                  width = maxSize;
                } else {
                  width = Math.round((width * maxSize) / height);
                  height = maxSize;
                }
              }
              
              // Canvas로 리사이즈
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              
              // JPEG로 압축 (품질 80%)
              const base64 = canvas.toDataURL('image/jpeg', quality);
              resolve({
                base64Data: base64.split(',')[1],
                mimeType: 'image/jpeg'
              });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      };
      
      // 사진 업로드 (Google Drive) - 리사이즈 후 업로드
      const uploadPhotoToGoogle = async (file) => {
        try {
          // 이미지 리사이즈
          const resized = await resizeImage(file);
          
          const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'uploadPhoto',
              fileName: Date.now() + '_' + file.name.replace(/\.[^.]+$/, '.jpg'),
              base64Data: resized.base64Data,
              mimeType: resized.mimeType
            })
          });
          const result = await response.json();
          if (result.success) {
            return result.url;
          } else {
            throw new Error(result.error);
          }
        } catch (error) {
          throw error;
        }
      };
      
      const [showModal, setShowModal] = useState(false);
      const [newIssue, setNewIssue] = useState({ date: '', supervisor: '', department: '', manager: '', description: '', issuePhotos: [] });
      const [selectedIds, setSelectedIds] = useState([]);
      
      const [newSupervisor, setNewSupervisor] = useState('');
      const [newDepartment, setNewDepartment] = useState('');
      const [newDeptPassword, setNewDeptPassword] = useState('');
      const [newManager, setNewManager] = useState('');
      const [newManagerEmail, setNewManagerEmail] = useState('');
      const [selectedDeptForManager, setSelectedDeptForManager] = useState('');
      
      const [newAdminName, setNewAdminName] = useState('');
      const [newAdminEmail, setNewAdminEmail] = useState('');

      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [pendingDept, setPendingDept] = useState(null);

      const [showEditPasswordModal, setShowEditPasswordModal] = useState(false);

      const [editDeptName, setEditDeptName] = useState('');
      const [newPasswordInput, setNewPasswordInput] = useState('');

      const [editingManager, setEditingManager] = useState(null);

      const [editManagerName, setEditManagerName] = useState('');
      const [editManagerEmail, setEditManagerEmail] = useState('');

      const [reportYear, setReportYear] = useState(new Date().getFullYear());

      const [monthlyDetails, setMonthlyDetails] = useState({});

      const [showPrintModal, setShowPrintModal] = useState(false);
      const [printYear, setPrintYear] = useState(new Date().getFullYear());
      const [printMonth, setPrintMonth] = useState('All');
      const [auditDate, setAuditDate] = useState('');
      const [auditorName, setAuditorName] = useState('James Hwang');
      const [auditorTitle, setAuditorTitle] = useState('Plant Manager');
      const [showPreview, setShowPreview] = useState(false);
      const [previewIssues, setPreviewIssues] = useState([]);
      const [imageSizes, setImageSizes] = useState({});
      const [currentPreviewPage, setCurrentPreviewPage] = useState(0);
      const [resizingImage, setResizingImage] = useState(null);
      const [resizeStart, setResizeStart] = useState({ x: 0, y: 0, size: 100 });
      const [viewerImage, setViewerImage] = useState(null); // 이미지 뷰어 {src, issueId, type, index}
      const [annotTool, setAnnotTool] = useState(''); // '', 'circle', 'rect', 'arrow'
      const [annotColor, setAnnotColor] = useState('#ff0000');
      const [annotLineWidth, setAnnotLineWidth] = useState(3); // 두께: 2, 3, 5, 8
      const [annotShapes, setAnnotShapes] = useState([]);
      const [annotDrawing, setAnnotDrawing] = useState(null); // {startX, startY}
      const canvasRef = React.useRef(null);
      const annotImgRef = React.useRef(null);
      
      // 리마인드 탭 상태
      const [remindSelectedIssues, setRemindSelectedIssues] = useState({});  // { 부서명: [issueId, ...] }
      const [remindSelectedManagers, setRemindSelectedManagers] = useState({});  // { 부서명: [managerEmail, ...] } - 받는 사람
      const [remindSelectedCC, setRemindSelectedCC] = useState({});  // { 부서명: [managerEmail, ...] } - CC
      const [sendingEmail, setSendingEmail] = useState(false);

      const styles = {
        container: { minHeight: '100vh', background: 'linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%)', color: 'white', padding: isMobile ? 12 : 24 },
        header: { marginBottom: isMobile ? 16 : 24 },
        title: { fontSize: isMobile ? 20 : 28, fontWeight: 700, background: 'linear-gradient(90deg, #a5b4fc, #818cf8)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' },
        tabBtn: (active) => ({ padding: isMobile ? '10px 12px' : '12px 24px', border: 'none', background: active ? 'rgba(99, 102, 241, 0.3)' : 'transparent', color: active ? '#a5b4fc' : 'rgba(255,255,255,0.6)', cursor: 'pointer', fontSize: isMobile ? 12 : 14, fontWeight: 500, borderBottom: active ? '2px solid #6366f1' : '2px solid transparent', transition: 'all 0.2s' }),
        statCard: { background: 'rgba(255,255,255,0.05)', borderRadius: 12, padding: isMobile ? 12 : 20, textAlign: 'center' },
        statLabel: { fontSize: isMobile ? 11 : 13, color: 'rgba(255,255,255,0.6)', marginBottom: isMobile ? 4 : 8 },
        statValue: (color) => ({ fontSize: isMobile ? 24 : 32, fontWeight: 700, color }),
        btnPrimary: { padding: isMobile ? '8px 14px' : '10px 20px', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', border: 'none', borderRadius: 8, color: 'white', cursor: 'pointer', fontWeight: 500, fontSize: isMobile ? 12 : 14 },
        btnSecondary: { padding: isMobile ? '8px 14px' : '10px 20px', background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', borderRadius: 8, color: 'white', cursor: 'pointer', fontWeight: 500, fontSize: isMobile ? 12 : 14 },
        btnDanger: { padding: isMobile ? '8px 14px' : '10px 20px', background: 'linear-gradient(135deg, #ef4444, #dc2626)', border: 'none', borderRadius: 8, color: 'white', cursor: 'pointer', fontWeight: 500, fontSize: isMobile ? 12 : 14 },
        table: { width: '100%', borderCollapse: 'collapse', background: 'rgba(255,255,255,0.03)', borderRadius: 12, overflow: 'hidden' },
        th: { padding: isMobile ? '10px 8px' : '14px 12px', textAlign: 'left', background: 'rgba(99, 102, 241, 0.2)', fontSize: isMobile ? 11 : 13, fontWeight: 600, color: '#a5b4fc', borderBottom: '1px solid rgba(255,255,255,0.1)', whiteSpace: 'nowrap' },
        td: { padding: isMobile ? '10px 8px' : '12px', borderBottom: '1px solid rgba(255,255,255,0.05)', fontSize: isMobile ? 11 : 13, verticalAlign: 'middle' },
        inlineInput: { width: '100%', padding: isMobile ? '6px 8px' : '8px 10px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 6, color: 'white', fontSize: isMobile ? 11 : 13 },
        modalOverlay: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: isMobile ? 16 : 0 },
        modalContent: { background: 'linear-gradient(135deg, #1e1e2f, #2d2d44)', padding: isMobile ? 20 : 32, borderRadius: 16, width: '95%', maxWidth: 500, maxHeight: '85vh', overflowY: 'auto' },

        textarea: { width: '100%', padding: isMobile ? '10px 12px' : '12px 16px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 8, color: 'white', fontSize: isMobile ? 13 : 14, marginBottom: 16, minHeight: isMobile ? 80 : 100, resize: 'vertical' },

        inputRow: { display: 'flex', gap: 12, marginBottom: 16, flexWrap: isMobile ? 'wrap' : 'nowrap' },

        actionBar: { display: 'flex', gap: 12, alignItems: 'center', marginBottom: 16, padding: isMobile ? 12 : 16, background: 'rgba(99, 102, 241, 0.1)', borderRadius: 12, flexWrap: 'wrap' },
        photoGrid: { display: 'flex', gap: 8, flexWrap: 'wrap' },
        photoThumb: { width: isMobile ? 50 : 60, height: isMobile ? 50 : 60, objectFit: 'cover', borderRadius: 8, border: '2px solid rgba(255,255,255,0.2)', cursor: 'pointer', transition: 'transform 0.2s' },
        statusBadge: (status) => {
          const colors = { 'Ongoing': '#f59e0b', 'Under Review': '#6366f1', 'Complete': '#10b981' };
          return { padding: '4px 12px', borderRadius: 20, fontSize: isMobile ? 10 : 12, fontWeight: 500, background: `${colors[status]}20`, color: colors[status], border: `1px solid ${colors[status]}40` };
        },
        deptCard: { background: 'rgba(255,255,255,0.05)', borderRadius: 12, padding: isMobile ? 16 : 20, cursor: 'pointer', transition: 'all 0.2s', border: '2px solid transparent' },
        deptCardActive: { background: 'rgba(99, 102, 241, 0.2)', borderColor: '#6366f1' },
        selectOption: { background: '#1e1e3f', color: 'white' }
      };

      const addIssue = async () => {
        if (!newIssue.date || !newIssue.supervisor || !newIssue.department || !newIssue.description) {
          alert('필수 항목을 입력해주세요.');
          return;
        }
        setIsSaving(true);
        setSavingMessage('💾 이슈 저장 중...');
        
        try {
          // Target Date = 일자 + 30일
          const issueDate = new Date(newIssue.date);
          issueDate.setDate(issueDate.getDate() + 30);
          const targetDate = issueDate.toISOString().split('T')[0];
          
          const issue = { ...newIssue, id: Date.now(), actionContent: '', actionPhotos: [], status: 'Ongoing', improvedDate: '', targetDate };
          
          // Google에 저장
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveIssue', issue })
          });
          
          setIssues([...issues, issue]);
          setNewIssue({ date: '', supervisor: '', department: '', manager: '', description: '', issuePhotos: [] });
          setShowModal(false);
        } catch (error) {
          console.error('저장 실패:', error);
          alert('저장에 실패했습니다.');
        }
        setIsSaving(false);
        setSavingMessage('');
      };

      const updateIssueField = async (id, field, value) => {
        const updatedIssues = issues.map(issue => issue.id === id ? { ...issue, [field]: value } : issue);
        setIssues(updatedIssues);
        
        // Google에 업데이트 (debounce 효과를 위해 setTimeout 사용 가능)
        const updatedIssue = updatedIssues.find(i => i.id === id);
        try {
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateIssue', issue: updatedIssue })
          });
        } catch (error) {
          console.error('업데이트 실패:', error);
        }
      };

      // 보고 버튼 클릭 시 - 수신자 선택 모달 열기
      const [reportModalIssueId, setReportModalIssueId] = useState(null);
      const [reportRecipients, setReportRecipients] = useState([]);
      const [reportCC, setReportCC] = useState([]);
      const [sendingReport, setSendingReport] = useState(false);

      const openReportModal = (id) => {
        const issue = issues.find(i => i.id === id);
        if (!issue.actionContent || String(issue.actionContent || '').trim() === '') {
          alert('조치내용을 입력해주세요.');
          return;
        }
        if (!issue.actionPhotos || issue.actionPhotos.length === 0) {
          alert('조치사진을 등록해주세요.');
          return;
        }
        // CC에 관리자 강제 포함
        setReportCC(admins.filter(a => a.email).map(a => a.email));
        setReportRecipients([]);
        setReportModalIssueId(id);
      };

      const submitReportWithEmail = async () => {
        if (reportRecipients.length === 0) {
          alert('수신자를 1명 이상 선택해주세요.');
          return;
        }
        const issue = issues.find(i => i.id === reportModalIssueId);
        if (!issue) return;
        
        setSendingReport(true);
        const updatedIssue = { ...issue, status: 'Under Review' };
        
        try {
          // 1. 이슈 상태 업데이트
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateIssue', issue: updatedIssue })
          });
          
          // 2. 조치완료 메일 발송
          const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'sendReportEmail',
              department: issue.department,
              recipients: reportRecipients,
              cc: reportCC,
              issue: {
                findingNum: (() => {
                  const d = safeParseDate(issue.date);
                  const deptIssues = issues.filter(i => {
                    const id2 = safeParseDate(i.date);
                    return id2.year === d.year && id2.month === d.month;
                  });
                  const idx = deptIssues.findIndex(i => i.id === issue.id);
                  return String(d.year).slice(-2) + String(d.month+1).padStart(2,'0') + '-' + String((idx >= 0 ? idx : 0)+1).padStart(2,'0');
                })(),
                date: issue.date,
                targetDate: issue.targetDate || '',
                description: issue.description || '',
                actionContent: issue.actionContent || '',
                manager: issue.manager || '',
                beforePhoto: issue.issuePhotos && issue.issuePhotos.length > 0 ? issue.issuePhotos[0] : '',
                afterPhoto: issue.actionPhotos && issue.actionPhotos.length > 0 ? issue.actionPhotos[0] : ''
              }
            })
          });
          
          const result = await response.json();
          
          setIssues(issues.map(i => i.id === reportModalIssueId ? updatedIssue : i));
          setReportModalIssueId(null);
          
          if (result.success) {
            alert('보고 완료! 조치완료 메일이 발송되었습니다.');
          } else {
            alert('보고는 완료되었으나, 메일 발송에 실패했습니다: ' + (result.error || ''));
          }
        } catch (error) {
          console.error('보고 실패:', error);
          alert('보고에 실패했습니다.');
        }
        setSendingReport(false);
      };

      const handlePhotoUpload = async (id, field, files) => {
        setIsSaving(true);
        setSavingMessage('📷 사진 업로드 중...');
        try {
          const uploadedUrls = [];
          for (const file of Array.from(files)) {
            const url = await uploadPhotoToGoogle(file);
            uploadedUrls.push(url);
          }
          
          const updatedIssues = issues.map(issue => 
            issue.id === id ? { ...issue, [field]: [...issue[field], ...uploadedUrls] } : issue
          );
          setIssues(updatedIssues);
          
          // Google에 업데이트
          const updatedIssue = updatedIssues.find(i => i.id === id);
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateIssue', issue: updatedIssue })
          });
        } catch (error) {
          console.error('사진 업로드 실패:', error);
          alert('사진 업로드에 실패했습니다.');
        }
        setIsSaving(false);
        setSavingMessage('');
      };

      const handleNewIssuePhoto = async (files) => {
        setIsSaving(true);
        setSavingMessage('📷 사진 업로드 중...');
        try {
          const uploadedUrls = [];
          for (const file of Array.from(files)) {
            const url = await uploadPhotoToGoogle(file);
            uploadedUrls.push(url);
          }
          setNewIssue({ ...newIssue, issuePhotos: [...newIssue.issuePhotos, ...uploadedUrls] });
        } catch (error) {
          console.error('사진 업로드 실패:', error);
          alert('사진 업로드에 실패했습니다.');
        }
        setIsSaving(false);
        setSavingMessage('');
      };

      // 이슈 삭제 (사진 포함)
      const deleteIssue = async (id, issuePhotos, actionPhotos) => {
        if (!confirm('이 이슈를 삭제하시겠습니까?\n사진과 데이터가 모두 삭제됩니다.')) {
          return;
        }
        
        setIsSaving(true);

      const safeParseDate = (dateStr) => {
        if (!dateStr) return { year: 0, month: -1, day: 0 };
        const s = String(dateStr);
        // YYYY-MM-DD 형식이면 직접 파싱
        const match = s.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (match) {
          return { year: parseInt(match[1]), month: parseInt(match[2]) - 1, day: parseInt(match[3]) };
        }
        // 그 외 형식은 Date 객체 사용 (로컬 타임존)
        const d = new Date(s);
        return { year: d.getFullYear(), month: d.getMonth(), day: d.getDate() };
      };

      const getMonthStats = (monthIndex) => {
        const monthIssues = issues.filter(i => {
          const d = safeParseDate(i.date);
          return d.year === currentYear && d.month === monthIndex;
        });
        const total = monthIssues.length;
        const closed = monthIssues.filter(i => i.status === 'Complete').length;
        const open = total - closed;
        const closeRate = total > 0 ? Math.round((closed / total) * 100) : 0;
        
        // Close Ratio 색상 계산
        let ratioColor = '';
        if (total > 0) {
          if (open === 0) {
            ratioColor = '#00ff00'; // 전부 완료 → 초록
          } else {
            const today = new Date();
            let maxOverdue = 0;
            const openIssues = monthIssues.filter(i => i.status !== 'Complete');
            openIssues.forEach(issue => {
              const td = issue.targetDate || (() => {
                if (issue.date) {
                  const dp = safeParseDate(issue.date);
                  const dd = new Date(dp.year, dp.month, dp.day + 30);
                  return dd.getFullYear() + '-' + String(dd.getMonth()+1).padStart(2,'0') + '-' + String(dd.getDate()).padStart(2,'0');
                }
                return '';
              })();
              if (td && new Date(td) < today) {
                const days = Math.floor((today - new Date(td)) / (1000 * 60 * 60 * 24));
                if (days > maxOverdue) maxOverdue = days;
              }
            });
            
            if (maxOverdue > 90) {
              ratioColor = '#ff0000'; // 91일+ → 빨강
            } else if (maxOverdue > 0) {
              ratioColor = '#ffff00'; // 1~90일 → 노랑
            }
            // Target Date 안 지남 → 흰색 (ratioColor 빈값 유지)
          }
        }
        
        return { total, closed, open, closeRate, ratioColor };
      };

          if (ws1) {
            const data = XLSX.utils.sheet_to_json(ws1, { header: 1 });
            const newSups = data.slice(1).map(row => row[0]).filter(s => s && !String(s).startsWith('예시') && !supervisors.includes(s));
            if (newSups.length) setSupervisors([...supervisors, ...newSups]);
          }
          
          const ws2 = wb.Sheets['부서목록'];
          if (ws2) {
            const data = XLSX.utils.sheet_to_json(ws2, { header: 1 });
            const newDepts = data.slice(1).filter(row => row[0] && !String(row[0]).startsWith('예시') && !departments.find(d => d.name === row[0])).map(row => ({name: row[0], password: row[1] || '1234'}));
            if (newDepts.length) {
              setDepartments([...departments, ...newDepts]);
              const newMgrs = {...managers};
              newDepts.forEach(d => { if (!newMgrs[d.name]) newMgrs[d.name] = []; });
              setManagers(newMgrs);
            }
          }
          
          const ws3 = wb.Sheets['담당자목록'];
          if (ws3) {
            const data = XLSX.utils.sheet_to_json(ws3, { header: 1 });
            const newMgrs = {...managers};
            data.slice(1).forEach(row => {
              if (row[0] && row[1] && !String(row[0]).startsWith('예시')) {
                if (!newMgrs[row[0]]) newMgrs[row[0]] = [];
                if (!newMgrs[row[0]].find(m => m.name === row[1])) {
                  newMgrs[row[0]].push({ name: row[1], email: row[2] || '' });
                }
              }
            });
            setManagers(newMgrs);
          }
          
          alert('엑셀 파일을 성공적으로 가져왔습니다.');
        };
        reader.readAsBinaryString(file);
        e.target.value = '';

                  <div style={styles.statCard}><div style={styles.statLabel}>Complete</div><div style={styles.statValue('#10b981')}>{issues.filter(i => i.status === 'Complete').length}</div></div>

                  </thead>

                    {(() => {

                      if (filtered.length === 0) {

                          const dp = safeParseDate(issue.date);
                          const dd = new Date(dp.year, dp.month, dp.day + 30);
                          return dd.getFullYear() + '-' + String(dd.getMonth()+1).padStart(2,'0') + '-' + String(dd.getDate()).padStart(2,'0');
                        }
                        return '';
                      })();
                      // Target Date 지남 여부 확인
                      const isOverdue = targetDate && new Date(targetDate) < new Date() && issue.status !== 'Complete';
                      
                      return (
                      <tr key={issue.id} style={{ background: selectedIds.includes(issue.id) ? 'rgba(99, 102, 241, 0.15)' : isOverdue ? 'rgba(239, 68, 68, 0.1)' : 'transparent' }}>

                          const updatedIssues = issues.map(i => i.id === issue.id ? { ...i, date: newDateStr, targetDate: newTarget } : i);

                              <th style={{ background: '#be185d', color: 'white', padding: '8px', border: '1px solid #333', width: 80 }}>Open #</th>
                            </tr>
                          </thead>
                          <tbody>
                            {monthNames.map((m, i) => {
                              const stats = getMonthStatsPreview(i);
                              return (
                                <tr key={m}>
                                  <td style={{ border: '1px solid #333', padding: '10px 8px', fontWeight: 600, textAlign: 'center' }}>{m}</td>
                                  <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center' }}>{stats.total || ''}</td>
                                  <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center' }}>{stats.closed || ''}</td>
                                  <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center' }}>{stats.open || ''}</td>
                                  <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center', background: stats.ratioColor || 'transparent', color: stats.ratioColor === '#ff0000' ? 'white' : '#000' }}>{stats.ratio}</td>
                                  <td style={{ border: '1px solid #333', padding: '10px 8px', fontSize: 12 }}></td>
                                </tr>
                              );
                            })}
                            <tr style={{ background: '#fef9c3' }}>
                              <td style={{ border: '1px solid #333', padding: '10px 8px', fontWeight: 700, color: '#dc2626', textAlign: 'center' }}>Total</td>
                              <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center', fontWeight: 700 }}>{yearTotal || ''}</td>
                              <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center', fontWeight: 700 }}>{yearClosed || ''}</td>
                              <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center', fontWeight: 700 }}>{yearOpen || ''}</td>
                              <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center' }}></td>
                              <td style={{ border: '1px solid #333', padding: '10px 8px' }}></td>
                            </tr>
                          </tbody>
                        </table>
                        
                        <h3 style={{ fontSize: 20, margin: '25px 0 10px 0', fontWeight: 700, color: '#000' }}>Open status for {printMonth === 'All' ? printYear + ' All' : printMonth + ' ' + printYear}</h3>
                        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14 }}>
                          <thead>
                            <tr>
                              <th style={{ background: '#fef9c3', padding: '12px 8px', border: '1px solid #333', width: 80 }}></th>
                              {departments.map(d => <th key={d.name} style={{ background: '#be185d', color: 'white', padding: '12px 8px', border: '1px solid #333' }}>{d.name}</th>)}
                              <th style={{ background: '#be185d', color: 'white', padding: '12px 8px', border: '1px solid #333' }}>All</th>
                            </tr>
                          </thead>
                          <tbody>
                            {['# of OFI', 'Open', 'Closed', 'Close Rate'].map(label => {
                              return (
                                <tr key={label}>
                                  <td style={{ background: '#fef9c3', border: '1px solid #333', padding: '10px 8px', fontWeight: 600 }}>{label}</td>
                                  {departments.map(dept => {
                                    const deptIssues = filteredForDept.filter(i => i.department === dept.name);
                                    const total = deptIssues.length;
                                    const closed = deptIssues.filter(i => i.status === 'Complete').length;
                                    const open = total - closed;
                                    const rate = total > 0 ? Math.round((closed/total)*100) + '%' : '0%';
                                    const rateBg = label === 'Close Rate' ? (total === 0 ? '' : (closed === total ? '#00ff00' : '#ffff00')) : '';
                                    const val = label === '# of OFI' ? total : label === 'Open' ? open : label === 'Closed' ? closed : rate;
                                    return <td key={dept.name} style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center', background: rateBg }}>{val}</td>;
                                  })}
                                  {(() => {
                                    const val = label === '# of OFI' ? allOfi : label === 'Open' ? allOpen2 : label === 'Closed' ? allClosed2 : allRate;
                                    const bg = label === 'Close Rate' ? allRateBg : '';
                                    return <td style={{ border: '1px solid #333', padding: '10px 8px', textAlign: 'center', fontWeight: 700, background: bg }}>{val}</td>;
                                  })()}
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                        <div style={{ textAlign: 'right', marginTop: 30 }}><span style={{ fontSize: 12, color: '#6b7280' }}>2</span></div>
                      </div>
                    );
                  })()}
                </div>

                {/* 각 이슈 페이지 */}
                {previewIssues.map((issue, idx) => {
                  const sizes = imageSizes[issue.id] || {};
                  const d = safeParseDate(issue.date);
                  const findingNum = String(d.year).slice(-2) + String(d.month + 1).padStart(2, '0') + '-' + String(idx + 1).padStart(2, '0');
                  
                  const renderResizableImage = (photos, type, sizes) => {
                    if (!photos || photos.length === 0) {
                      return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: '#9ca3af', fontSize: 16 }}>No Image</div>;
                    }
                    
                    const renderOnePhoto = (photo, photoIdx, maxW, maxH) => {
                      const w = sizes[type + photoIdx + 'W'] || 100;
                      const h = sizes[type + photoIdx + 'H'] || 100;
                      const imgW = Math.round(maxW * w / 100);
                      const imgH = Math.round(maxH * h / 100);
                      return (
                        <div style={{ position: 'relative', display: 'inline-block' }}>
                          <img src={photo} style={{ width: imgW, height: imgH, objectFit: 'fill', display: 'block' }} />
                          <div onMouseDown={(e) => handleResizeStart(e, issue.id, type, photoIdx, 'w')}
                            style={{ position: 'absolute', top: '50%', right: -6, marginTop: -10, width: 12, height: 20, background: '#3b82f6', borderRadius: 3, cursor: 'ew-resize', zIndex: 10, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <span style={{ color: 'white', fontSize: 8, fontWeight: 'bold' }}>↔</span>
                          </div>
                          <div onMouseDown={(e) => handleResizeStart(e, issue.id, type, photoIdx, 'h')}
                            style={{ position: 'absolute', bottom: -6, left: '50%', marginLeft: -10, width: 20, height: 12, background: '#3b82f6', borderRadius: 3, cursor: 'ns-resize', zIndex: 10, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <span style={{ color: 'white', fontSize: 8, fontWeight: 'bold' }}>↕</span>
                          </div>
                          <div onMouseDown={(e) => handleResizeStart(e, issue.id, type, photoIdx, 'both')}
                            style={{ position: 'absolute', bottom: -5, right: -5, width: 14, height: 14, background: '#f59e0b', borderRadius: 3, cursor: 'nwse-resize', zIndex: 10, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <span style={{ color: 'white', fontSize: 8, fontWeight: 'bold' }}>↘</span>
                          </div>
                          <div style={{ position: 'absolute', top: 4, left: 4, background: 'rgba(0,0,0,0.6)', color: 'white', padding: '2px 6px', borderRadius: 3, fontSize: 9, zIndex: 10 }}>W:{w}% H:{h}%</div>
                        </div>
                      );
                    };
                    
                    if (photos.length === 1) {
                      return (
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
                          {renderOnePhoto(photos[0], 0, 480, 350)}
                        </div>
                      );
                    } else {
                      return (
                        <div style={{ position: 'relative', width: '100%', height: '100%' }}>
                          <div style={{ position: 'absolute', top: 0, left: 0, zIndex: 5 }}>
                            {renderOnePhoto(photos[0], 0, 240, 200)}
                          </div>
                          <div style={{ position: 'absolute', bottom: 0, right: 0, zIndex: 2 }}>
                            {renderOnePhoto(photos[1], 1, 240, 200)}
                          </div>
                        </div>
                      );
                    }
                  };
                  
                  return (
                    <div key={issue.id} style={{ background: 'white', width: 1100, borderRadius: 4, boxShadow: '0 4px 20px rgba(0,0,0,0.4)', overflow: 'hidden' }}>
                      <div style={{ textAlign: 'center', padding: 10, background: '#f0f0f0', color: '#6b7280', fontSize: 12, fontWeight: 600 }}>
                        페이지 {idx + 3} / {previewIssues.length + 2}
                      </div>
                      
                      <div style={{ padding: '30px 40px', fontFamily: 'Arial, sans-serif', color: '#000' }}>
                        <h1 style={{ color: '#1e3a5f', fontSize: 32, fontWeight: 800, margin: '0 0 25px 0' }}>Safety / 5S+</h1>
                        
                        <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: 25, fontSize: 15, tableLayout: 'fixed' }}>
                          <tbody>
                            <tr>
                              <td style={{ padding: '12px 18px', width: '15%', fontWeight: 700, border: '1px solid #333' }}>Finding#</td>
                              <td style={{ padding: '12px 18px', width: '35%', border: '1px solid #333' }}>{findingNum}</td>
                              <td style={{ padding: '12px 18px', width: '22%', fontWeight: 700, border: '1px solid #333' }}>Location/Dept/Response</td>
                              <td style={{ padding: '12px 18px', width: '28%', border: '1px solid #333' }}>{issue.department} – {issue.manager || 'N/A'}</td>
                            </tr>
                          </tbody>
                        </table>
                        
                        <table style={{ width: '100%', borderCollapse: 'collapse', tableLayout: 'fixed' }}>
                          <thead>
                            <tr>
                              <th style={{ background: '#ff0000', color: '#000', padding: 16, width: '50%', fontSize: 18, fontWeight: 600, border: '1px solid #333' }}>Before</th>
                              <th style={{ background: '#00ff00', color: '#000', padding: 16, width: '50%', fontSize: 18, fontWeight: 600, border: '1px solid #333' }}>After</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td style={{ border: '1px solid #333', padding: 0, verticalAlign: 'top', background: 'white', position: 'relative' }}>
                                <div style={{ height: 380, padding: 15, overflow: 'hidden', position: 'relative', boxSizing: 'border-box' }}>
                                  {renderResizableImage(issue.issuePhotos, 'before', sizes)}
                                </div>
                              </td>
                              <td style={{ border: '1px solid #333', padding: 0, verticalAlign: 'top', background: 'white', position: 'relative' }}>
                                <div style={{ height: 380, padding: 15, overflow: 'hidden', position: 'relative', boxSizing: 'border-box' }}>
                                  {renderResizableImage(issue.actionPhotos, 'after', sizes)}
                                </div>
                              </td>
                            </tr>
                            <tr>
                              <td style={{ border: '1px solid #333', padding: '18px 22px', verticalAlign: 'top', height: 120, fontSize: 15, lineHeight: 1.7 }}>{issue.description || ''}</td>
                              <td style={{ border: '1px solid #333', padding: '18px 22px', verticalAlign: 'top', height: 120, fontSize: 15, lineHeight: 1.7 }}>{issue.actionContent || ''}</td>
                            </tr>
                          </tbody>
                        </table>
                        
                        <div style={{ textAlign: 'right', marginTop: 20 }}><span style={{ fontSize: 14, color: '#6b7280' }}>{idx + 3}</span></div>
                      </div>
                    </div>
                  );
                })}
                
                {previewIssues.length === 0 && (
                  <div style={{ background: 'white', width: 1100, padding: 60, borderRadius: 4, textAlign: 'center', color: '#666' }}>
                    해당 기간에 등록된 이슈가 없습니다.
                  </div>
                )}

                
                <div style={{ height: 40 }} />
              </div>
            </div>
          )}

          {/* 이미지 주석 뷰어 모달 */}
          {viewerImage && (() => {
            const drawCanvas = (shapes, currentDraw) => {
              const canvas = canvasRef.current;
              const img = annotImgRef.current;
              if (!canvas || !img) return;
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              
              const allShapes = currentDraw ? [...shapes, currentDraw] : shapes;
              allShapes.forEach(s => {
                ctx.strokeStyle = s.color;
                ctx.lineWidth = s.lineWidth || 3;
                ctx.setLineDash([]);
                if (s.tool === 'circle') {
                  const cx = (s.x1 + s.x2) / 2;
                  const cy = (s.y1 + s.y2) / 2;
                  const rx = Math.abs(s.x2 - s.x1) / 2;
                  const ry = Math.abs(s.y2 - s.y1) / 2;
                  ctx.beginPath();
                  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                  ctx.stroke();
                } else if (s.tool === 'rect') {
                  ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
                } else if (s.tool === 'arrow') {
                  const dx = s.x2 - s.x1;
                  const dy = s.y2 - s.y1;
                  const angle = Math.atan2(dy, dx);
                  const len = Math.sqrt(dx*dx + dy*dy);
                  const headLen = Math.min(12 + (s.lineWidth || 3) * 3, len * 0.3);
                  ctx.beginPath();
                  ctx.moveTo(s.x1, s.y1);
                  ctx.lineTo(s.x2, s.y2);
                  ctx.stroke();
                  ctx.beginPath();
                  ctx.moveTo(s.x2, s.y2);
                  ctx.lineTo(s.x2 - headLen * Math.cos(angle - Math.PI/6), s.y2 - headLen * Math.sin(angle - Math.PI/6));
                  ctx.moveTo(s.x2, s.y2);
                  ctx.lineTo(s.x2 - headLen * Math.cos(angle + Math.PI/6), s.y2 - headLen * Math.sin(angle + Math.PI/6));
                  ctx.stroke();
                }
              });
            };
            
            const getPos = (e) => {
              const canvas = canvasRef.current;
              if (!canvas) return {x:0, y:0};
              const rect = canvas.getBoundingClientRect();
              return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };
            
            return (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.95)', zIndex: 9999, display: 'flex', flexDirection: 'column' }}>
                {/* 상단 툴바 */}
                <div style={{ padding: '10px 20px', display: 'flex', alignItems: 'center', gap: 12, background: 'rgba(30,30,50,0.95)', borderBottom: '1px solid rgba(255,255,255,0.1)' }} onClick={e => e.stopPropagation()}>
                  {viewerImage.type === 'issue' ? (
                    <>
                      <span style={{ color: 'white', fontSize: 14, fontWeight: 600, marginRight: 8 }}>🖊️ 주석 도구</span>
                      {[
                        { id: 'circle', icon: '⭕', label: '원형' },
                        { id: 'rect', icon: '⬜', label: '네모' },
                        { id: 'arrow', icon: '➡️', label: '화살표' }
                      ].map(t => (
                        <button key={t.id} onClick={() => setAnnotTool(annotTool === t.id ? '' : t.id)} style={{
                          padding: '8px 16px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: 600,
                          background: annotTool === t.id ? '#3b82f6' : 'rgba(255,255,255,0.15)',
                          color: annotTool === t.id ? 'white' : 'rgba(255,255,255,0.8)'
                        }}>{t.icon} {t.label}</button>
                      ))}
                      
                      <span style={{ color: 'rgba(255,255,255,0.5)', margin: '0 4px' }}>|</span>
                      
                      {['#ff0000', '#00ff00', '#ffff00', '#00bfff', '#ffffff'].map(c => (
                        <button key={c} onClick={() => setAnnotColor(c)} style={{
                          width: 28, height: 28, borderRadius: '50%', border: annotColor === c ? '3px solid white' : '2px solid rgba(255,255,255,0.3)',
                          background: c, cursor: 'pointer', padding: 0
                        }} />
                      ))}
                      
                      <span style={{ color: 'rgba(255,255,255,0.5)', margin: '0 4px' }}>|</span>
                      
                      {/* 두께 선택 */}
                      {[
                        { w: 2, label: '가늘게' },
                        { w: 3, label: '보통' },
                        { w: 5, label: '굵게' },
                        { w: 8, label: '매우 굵게' }
                      ].map(t => (
                        <button key={t.w} onClick={() => setAnnotLineWidth(t.w)} title={t.label} style={{
                          width: 32, height: 28, borderRadius: 6, border: 'none', cursor: 'pointer',
                          background: annotLineWidth === t.w ? '#3b82f6' : 'rgba(255,255,255,0.15)',
                          display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0
                        }}>
                          <div style={{ width: 18, height: t.w, background: annotLineWidth === t.w ? 'white' : 'rgba(255,255,255,0.7)', borderRadius: t.w / 2 }} />
                        </button>
                      ))}
                      
                      <span style={{ color: 'rgba(255,255,255,0.5)', margin: '0 4px' }}>|</span>
                      
                      <button onClick={() => setAnnotShapes(s => s.slice(0, -1))} disabled={annotShapes.length === 0} style={{
                        padding: '8px 16px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 13,
                        background: 'rgba(255,255,255,0.15)', color: 'rgba(255,255,255,0.8)', opacity: annotShapes.length === 0 ? 0.3 : 1
                      }}>↩️ 실행취소</button>
                      
                      <button onClick={() => setAnnotShapes([])} style={{
                        padding: '8px 16px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 13,
                        background: 'rgba(255,255,255,0.15)', color: 'rgba(255,255,255,0.8)'
                      }}>🗑️ 전체삭제</button>
                      
                      <div style={{ flex: 1 }} />
                      
                      {annotShapes.length > 0 && (
                        <button onClick={async () => {
                          const canvas = canvasRef.current;
                          if (!canvas) return;
                          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                          const info = viewerImage;
                          const updated = issues.map(issue => {
                            if (issue.id !== info.issueId) return issue;
                            const field = info.type === 'issue' ? 'issuePhotos' : 'actionPhotos';
                            const photos = [...(issue[field] || [])];
                            photos[info.index] = dataUrl;
                            return { ...issue, [field]: photos };
                          });
                          setIssues(updated);
                          const updatedIssue = updated.find(i => i.id === info.issueId);
                          try {
                            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateIssue', issue: updatedIssue }) });
                          } catch(err) { console.error(err); }
                          setAnnotShapes([]);
                          setAnnotTool('');
                          setViewerImage({...info, src: dataUrl});
                          alert('저장 완료!');
                        }} style={{
                          padding: '8px 20px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 14, fontWeight: 700,
                          background: 'linear-gradient(135deg, #10b981, #059669)', color: 'white'
                        }}>💾 저장</button>
                      )}
                    </>
                  ) : (
                    <>
                      <span style={{ color: 'white', fontSize: 14, fontWeight: 600 }}>🔍 조치사진 보기</span>
                      <div style={{ flex: 1 }} />
                    </>
                  )}
                  
                  <button onClick={() => { setViewerImage(null); setAnnotShapes([]); setAnnotTool(''); setAnnotDrawing(null); }} style={{
                    padding: '8px 20px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 14,
                    background: 'rgba(255,255,255,0.2)', color: 'white'
                  }}>✕ 닫기</button>
                </div>
                
                {/* 이미지 영역: 지적사진=캔버스, 조치사진=단순보기 */}
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}
                  onClick={() => { if (viewerImage.type !== 'issue') { setViewerImage(null); } }}
                >
                  {viewerImage.type === 'issue' ? (
                    <>
                      <img 
                        ref={annotImgRef}
                        src={viewerImage.src} 
                        style={{ display: 'none' }}
                        crossOrigin="anonymous"
                        onLoad={(e) => {
                          const img = e.target;
                          const canvas = canvasRef.current;
                          if (!canvas) return;
                          const maxW = window.innerWidth * 0.9;
                          const maxH = (window.innerHeight - 70) * 0.95;
                          let w = img.naturalWidth;
                          let h = img.naturalHeight;
                          const ratio = Math.min(maxW / w, maxH / h, 1);
                          canvas.width = w * ratio;
                          canvas.height = h * ratio;
                          const ctx = canvas.getContext('2d');
                          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        }}
                      />
                      <canvas 
                        ref={canvasRef}
                        style={{ 
                          borderRadius: 4, cursor: annotTool ? 'crosshair' : 'default',
                          boxShadow: '0 4px 30px rgba(0,0,0,0.5)'
                        }}
                        onMouseDown={(e) => {
                          if (!annotTool) return;
                          const pos = getPos(e);
                          setAnnotDrawing({ x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y, tool: annotTool, color: annotColor, lineWidth: annotLineWidth });
                        }}
                        onMouseMove={(e) => {
                          if (!annotDrawing) return;
                          const pos = getPos(e);
                          const cur = { ...annotDrawing, x2: pos.x, y2: pos.y };
                          setAnnotDrawing(cur);
                          drawCanvas(annotShapes, cur);
                        }}
                        onMouseUp={(e) => {
                          if (!annotDrawing) return;
                          const pos = getPos(e);
                          const final = { ...annotDrawing, x2: pos.x, y2: pos.y };
                          const dx = Math.abs(final.x2 - final.x1);
                          const dy = Math.abs(final.y2 - final.y1);
                          if (dx > 5 || dy > 5) {
                            const newShapes = [...annotShapes, final];
                            setAnnotShapes(newShapes);
                            drawCanvas(newShapes, null);
                          }
                          setAnnotDrawing(null);
                        }}
                      />
                    </>
                  ) : (
                    <img 
                      src={viewerImage.src} 
                      style={{ maxWidth: '90vw', maxHeight: '90vh', objectFit: 'contain', borderRadius: 8, boxShadow: '0 4px 30px rgba(0,0,0,0.5)' }} 
                      alt=""
                      onClick={(e) => e.stopPropagation()}
                    />
                  )}
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    ReactDOM.render(<GembaWalk />, document.getElementById('root'));
  </script>
</body>
</html>
