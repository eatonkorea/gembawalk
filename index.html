<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemba Walk</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* 모바일 반응형 */
    @media (max-width: 768px) {
      .mobile-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .mobile-scroll table { min-width: 800px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function GembaWalk() {
      const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
      const [activeTab, setActiveTab] = useState('action');
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [selectedDeptForAction, setSelectedDeptForAction] = useState(null);
      
      // 화면 크기 감지
      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth <= 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      
      const [supervisors, setSupervisors] = useState(['생산관리팀', '품질관리팀', '안전환경팀']);
      const [departments, setDepartments] = useState([
        {name: '생산1팀', password: '1234'},
        {name: '생산2팀', password: '1234'},
        {name: '품질팀', password: '1234'},
        {name: '설비팀', password: '1234'}
      ]);
      const [managers, setManagers] = useState({
        '생산1팀': [{name: '김철수', email: 'kim@company.com'}, {name: '이영희', email: 'lee@company.com'}],
        '생산2팀': [{name: '박민수', email: 'park@company.com'}, {name: '정대리', email: 'jung@company.com'}],
        '품질팀': [{name: '최품질', email: 'choi@company.com'}, {name: '강검사', email: 'kang@company.com'}],
        '설비팀': [{name: '윤설비', email: 'yoon@company.com'}]
      });

      const [issues, setIssues] = useState([
        {
          id: 1,
          date: '2025-01-30',
          supervisor: '생산관리팀',
          department: '생산1팀',
          manager: '김철수',
          description: '바닥 미끄러움 주의 필요',
          issuePhotos: [],
          actionContent: '미끄럼 방지 테이프 부착 완료',
          actionPhotos: [],
          status: 'Complete',
          improvedDate: '2025-01-31'
        },
        {
          id: 2,
          date: '2025-01-31',
          supervisor: '안전환경팀',
          department: '생산2팀',
          manager: '',
          description: '소화기 점검 필요',
          issuePhotos: [],
          actionContent: '',
          actionPhotos: [],
          status: 'Ongoing',
          improvedDate: ''
        }
      ]);
      
      const [showModal, setShowModal] = useState(false);
      const [newIssue, setNewIssue] = useState({ date: '', supervisor: '', department: '', manager: '', description: '', issuePhotos: [] });
      const [selectedIds, setSelectedIds] = useState([]);
      
      const [newSupervisor, setNewSupervisor] = useState('');
      const [newDepartment, setNewDepartment] = useState('');
      const [newDeptPassword, setNewDeptPassword] = useState('');
      const [newManager, setNewManager] = useState('');
      const [newManagerEmail, setNewManagerEmail] = useState('');
      const [selectedDeptForManager, setSelectedDeptForManager] = useState('');

      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [pendingDept, setPendingDept] = useState(null);

      const [showEditPasswordModal, setShowEditPasswordModal] = useState(false);
      const [editingDept, setEditingDept] = useState(null);
      const [editDeptName, setEditDeptName] = useState('');
      const [newPasswordInput, setNewPasswordInput] = useState('');

      const [showEditManagerModal, setShowEditManagerModal] = useState(false);
      const [editingManager, setEditingManager] = useState(null);
      const [editManagerDept, setEditManagerDept] = useState('');
      const [editManagerName, setEditManagerName] = useState('');
      const [editManagerEmail, setEditManagerEmail] = useState('');

      const [reportYear, setReportYear] = useState(new Date().getFullYear());
      const [reportMonth, setReportMonth] = useState('All');
      const [monthlyDetails, setMonthlyDetails] = useState({});

      const [showPrintModal, setShowPrintModal] = useState(false);
      const [printYear, setPrintYear] = useState(new Date().getFullYear());
      const [printMonth, setPrintMonth] = useState('All');
      const [showPreview, setShowPreview] = useState(false);
      const [previewIssues, setPreviewIssues] = useState([]);
      const [imageSizes, setImageSizes] = useState({});
      const [currentPreviewPage, setCurrentPreviewPage] = useState(0);
      const [resizingImage, setResizingImage] = useState(null);
      const [resizeStart, setResizeStart] = useState({ x: 0, y: 0, size: 100 });
      const [viewerImage, setViewerImage] = useState(null); // 이미지 뷰어

      const styles = {
        container: { minHeight: '100vh', background: 'linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%)', color: 'white', padding: isMobile ? 12 : 24 },
        header: { marginBottom: isMobile ? 16 : 24 },
        title: { fontSize: isMobile ? 20 : 28, fontWeight: 700, background: 'linear-gradient(90deg, #a5b4fc, #818cf8)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' },
        tabBtn: (active) => ({ padding: isMobile ? '10px 12px' : '12px 24px', border: 'none', background: active ? 'rgba(99, 102, 241, 0.3)' : 'transparent', color: active ? '#a5b4fc' : 'rgba(255,255,255,0.6)', cursor: 'pointer', fontSize: isMobile ? 12 : 14, fontWeight: 500, borderBottom: active ? '2px solid #6366f1' : '2px solid transparent', transition: 'all 0.2s' }),
        statCard: { background: 'rgba(255,255,255,0.05)', borderRadius: 12, padding: isMobile ? 12 : 20, textAlign: 'center' },
        statLabel: { fontSize: isMobile ? 11 : 13, color: 'rgba(255,255,255,0.6)', marginBottom: isMobile ? 4 : 8 },
        statValue: (color) => ({ fontSize: isMobile ? 24 : 32, fontWeight: 700, color }),
        btnPrimary: { padding: isMobile ? '8px 14px' : '10px 20px', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', border: 'none', borderRadius: 8, color: 'white', cursor: 'pointer', fontWeight: 500, fontSize: isMobile ? 12 : 14 },
        btnSecondary: { padding: isMobile ? '8px 14px' : '10px 20px', background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', borderRadius: 8, color: 'white', cursor: 'pointer', fontWeight: 500, fontSize: isMobile ? 12 : 14 },
        btnDanger: { padding: isMobile ? '8px 14px' : '10px 20px', background: 'linear-gradient(135deg, #ef4444, #dc2626)', border: 'none', borderRadius: 8, color: 'white', cursor: 'pointer', fontWeight: 500, fontSize: isMobile ? 12 : 14 },
        table: { width: '100%', borderCollapse: 'collapse', background: 'rgba(255,255,255,0.03)', borderRadius: 12, overflow: 'hidden' },
        th: { padding: isMobile ? '10px 8px' : '14px 12px', textAlign: 'left', background: 'rgba(99, 102, 241, 0.2)', fontSize: isMobile ? 11 : 13, fontWeight: 600, color: '#a5b4fc', borderBottom: '1px solid rgba(255,255,255,0.1)', whiteSpace: 'nowrap' },
        td: { padding: isMobile ? '10px 8px' : '12px', borderBottom: '1px solid rgba(255,255,255,0.05)', fontSize: isMobile ? 11 : 13, verticalAlign: 'top' },
        inlineInput: { width: '100%', padding: isMobile ? '6px 8px' : '8px 10px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 6, color: 'white', fontSize: isMobile ? 11 : 13 },
        modalOverlay: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: isMobile ? 16 : 0 },
        modalContent: { background: 'linear-gradient(135deg, #1e1e2f, #2d2d44)', padding: isMobile ? 20 : 32, borderRadius: 16, width: '95%', maxWidth: 500, maxHeight: '85vh', overflowY: 'auto' },
        input: { width: '100%', padding: isMobile ? '10px 12px' : '12px 16px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 8, color: 'white', fontSize: isMobile ? 13 : 14, marginBottom: 16 },
        textarea: { width: '100%', padding: isMobile ? '10px 12px' : '12px 16px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 8, color: 'white', fontSize: isMobile ? 13 : 14, marginBottom: 16, minHeight: isMobile ? 80 : 100, resize: 'vertical' },
        settingsCard: { background: 'rgba(255,255,255,0.05)', borderRadius: 12, padding: isMobile ? 16 : 24, marginBottom: isMobile ? 16 : 24 },
        settingsInput: { padding: isMobile ? '8px 10px' : '10px 14px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 8, color: 'white', fontSize: isMobile ? 12 : 14 },
        inputRow: { display: 'flex', gap: 12, marginBottom: 16, flexWrap: isMobile ? 'wrap' : 'nowrap' },
        tag: { display: 'inline-flex', alignItems: 'center', gap: 8, padding: '6px 12px', background: 'rgba(99, 102, 241, 0.2)', borderRadius: 20, fontSize: isMobile ? 11 : 13, margin: '4px' },
        actionBar: { display: 'flex', gap: 12, alignItems: 'center', marginBottom: 16, padding: isMobile ? 12 : 16, background: 'rgba(99, 102, 241, 0.1)', borderRadius: 12, flexWrap: 'wrap' },
        photoGrid: { display: 'flex', gap: 8, flexWrap: 'wrap' },
        photoThumb: { width: isMobile ? 50 : 60, height: isMobile ? 50 : 60, objectFit: 'cover', borderRadius: 8, border: '2px solid rgba(255,255,255,0.2)', cursor: 'pointer', transition: 'transform 0.2s' },
        statusBadge: (status) => {
          const colors = { 'Ongoing': '#f59e0b', 'Under Review': '#6366f1', 'Complete': '#10b981' };
          return { padding: '4px 12px', borderRadius: 20, fontSize: isMobile ? 10 : 12, fontWeight: 500, background: `${colors[status]}20`, color: colors[status], border: `1px solid ${colors[status]}40` };
        },
        deptCard: { background: 'rgba(255,255,255,0.05)', borderRadius: 12, padding: isMobile ? 16 : 20, cursor: 'pointer', transition: 'all 0.2s', border: '2px solid transparent' },
        deptCardActive: { background: 'rgba(99, 102, 241, 0.2)', borderColor: '#6366f1' },
        selectOption: { background: '#1e1e3f', color: 'white' }
      };

      const addIssue = () => {
        if (!newIssue.date || !newIssue.supervisor || !newIssue.department || !newIssue.description) {
          alert('필수 항목을 입력해주세요.');
          return;
        }
        // Target Date = 일자 + 30일
        const issueDate = new Date(newIssue.date);
        issueDate.setDate(issueDate.getDate() + 30);
        const targetDate = issueDate.toISOString().split('T')[0];
        
        setIssues([...issues, { ...newIssue, id: Date.now(), actionContent: '', actionPhotos: [], status: 'Ongoing', improvedDate: '', targetDate }]);
        setNewIssue({ date: '', supervisor: '', department: '', manager: '', description: '', issuePhotos: [] });
        setShowModal(false);
      };

      const updateIssueField = (id, field, value) => {
        setIssues(issues.map(issue => issue.id === id ? { ...issue, [field]: value } : issue));
      };

      // 보고 버튼 클릭 시 Under Review로 변경
      const submitReport = (id) => {
        const issue = issues.find(i => i.id === id);
        if (!issue.actionContent || issue.actionContent.trim() === '') {
          alert('조치내용을 입력해주세요.');
          return;
        }
        if (!issue.actionPhotos || issue.actionPhotos.length === 0) {
          alert('조치사진을 등록해주세요.');
          return;
        }
        setIssues(issues.map(issue => issue.id === id ? { ...issue, status: 'Under Review' } : issue));
        alert('보고가 완료되었습니다.');
      };

      const handlePhotoUpload = (id, field, files) => {
        const photos = Array.from(files).map(file => URL.createObjectURL(file));
        setIssues(issues.map(issue => issue.id === id ? { ...issue, [field]: [...issue[field], ...photos] } : issue));
      };

      const handleNewIssuePhoto = (files) => {
        const photos = Array.from(files).map(file => URL.createObjectURL(file));
        setNewIssue({ ...newIssue, issuePhotos: [...newIssue.issuePhotos, ...photos] });
      };

      const toggleSelect = (id) => {
        if (selectedIds.includes(id)) {
          setSelectedIds(selectedIds.filter(i => i !== id));
        } else if (selectedIds.length < 2) {
          setSelectedIds([...selectedIds, id]);
        }
      };

      const mergeIssues = () => {
        if (selectedIds.length !== 2) return;
        const [first, second] = selectedIds.map(id => issues.find(i => i.id === id));
        const merged = {
          ...first,
          description: first.description + '\n---\n' + second.description,
          issuePhotos: [...first.issuePhotos, ...second.issuePhotos],
          actionContent: (first.actionContent || '') + (second.actionContent ? '\n---\n' + second.actionContent : ''),
          actionPhotos: [...first.actionPhotos, ...second.actionPhotos]
        };
        setIssues(issues.filter(i => i.id !== second.id).map(i => i.id === first.id ? merged : i));
        setSelectedIds([]);
      };

      const deleteSelected = () => {
        if (confirm('선택한 항목을 삭제하시겠습니까?')) {
          setIssues(issues.filter(i => !selectedIds.includes(i.id)));
          setSelectedIds([]);
        }
      };

      const addSupervisor = () => {
        if (newSupervisor.trim() && !supervisors.includes(newSupervisor.trim())) {
          setSupervisors([...supervisors, newSupervisor.trim()]);
          setNewSupervisor('');
        }
      };

      const addDepartment = () => {
        if (newDepartment.trim() && !departments.find(d => d.name === newDepartment.trim())) {
          setDepartments([...departments, {name: newDepartment.trim(), password: newDeptPassword || '1234'}]);
          setManagers({...managers, [newDepartment.trim()]: []});
          setNewDepartment('');
          setNewDeptPassword('');
        }
      };

      const addManager = () => {
        if (newManager.trim() && selectedDeptForManager) {
          const newMgr = { name: newManager.trim(), email: newManagerEmail.trim() };
          setManagers({...managers, [selectedDeptForManager]: [...(managers[selectedDeptForManager] || []), newMgr]});
          setNewManager('');
          setNewManagerEmail('');
        }
      };

      const removeSupervisor = (s) => setSupervisors(supervisors.filter(sup => sup !== s));
      const removeDepartment = (deptName) => {
        setDepartments(departments.filter(d => d.name !== deptName));
        const newManagers = {...managers};
        delete newManagers[deptName];
        setManagers(newManagers);
      };
      const removeManager = (dept, mgrName) => setManagers({...managers, [dept]: managers[dept].filter(m => m.name !== mgrName)});

      const handleDeptClick = (dept) => {
        setPendingDept(dept);
        setPasswordInput('');
        setShowPasswordModal(true);
      };

      const verifyPassword = () => {
        if (pendingDept && passwordInput === pendingDept.password) {
          setSelectedDeptForAction(pendingDept.name);
          setShowPasswordModal(false);
          setPasswordInput('');
          setPendingDept(null);
        } else {
          alert('비밀번호가 틀렸습니다.');
        }
      };

      const openEditPasswordModal = (dept) => {
        setEditingDept(dept);
        setEditDeptName(dept.name);
        setNewPasswordInput(dept.password);
        setShowEditPasswordModal(true);
      };

      const saveNewPassword = () => {
        if (editingDept && editDeptName.trim()) {
          const oldName = editingDept.name;
          const newName = editDeptName.trim();
          
          setDepartments(departments.map(d => d.name === oldName ? {...d, name: newName, password: newPasswordInput} : d));
          
          if (oldName !== newName) {
            const newManagers = {...managers};
            newManagers[newName] = newManagers[oldName] || [];
            delete newManagers[oldName];
            setManagers(newManagers);
            
            setIssues(issues.map(issue => issue.department === oldName ? {...issue, department: newName} : issue));
          }
          
          setShowEditPasswordModal(false);
          setEditingDept(null);
          setEditDeptName('');
          setNewPasswordInput('');
        }
      };

      const openEditManagerModal = (dept, mgr) => {
        setEditingManager(mgr);
        setEditManagerDept(dept);
        setEditManagerName(mgr.name);
        setEditManagerEmail(mgr.email);
        setShowEditManagerModal(true);
      };

      const saveEditManager = () => {
        if (editingManager && editManagerName.trim()) {
          const oldName = editingManager.name;
          const newName = editManagerName.trim();
          
          setManagers({
            ...managers,
            [editManagerDept]: managers[editManagerDept].map(m => 
              m.name === oldName ? {name: newName, email: editManagerEmail.trim()} : m
            )
          });
          
          if (oldName !== newName) {
            setIssues(issues.map(issue => 
              issue.department === editManagerDept && issue.manager === oldName 
                ? {...issue, manager: newName} 
                : issue
            ));
          }
          
          setShowEditManagerModal(false);
          setEditingManager(null);
          setEditManagerDept('');
          setEditManagerName('');
          setEditManagerEmail('');
        }
      };

      const currentYear = reportYear;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];

      const getMonthStats = (monthIndex) => {
        const monthIssues = issues.filter(i => {
          const d = new Date(i.date);
          return d.getFullYear() === currentYear && d.getMonth() === monthIndex;
        });
        const total = monthIssues.length;
        const closed = monthIssues.filter(i => i.status === 'Complete').length;
        const open = total - closed;
        const closeRate = total > 0 ? Math.round((closed / total) * 100) : 0;
        return { total, closed, open, closeRate };
      };

      const getYearlyTotal = () => {
        const yearIssues = issues.filter(i => new Date(i.date).getFullYear() === currentYear);
        const total = yearIssues.length;
        const closed = yearIssues.filter(i => i.status === 'Complete').length;
        const open = total - closed;
        return { total, closed, open };
      };

      const handlePrintReport = () => {
        downloadReport();
      };

      const openPreview = () => {
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const monthIndex = monthNames.indexOf(printMonth);
        
        const filtered = issues.filter(i => {
          const d = new Date(i.date);
          if (printMonth === 'All') return d.getFullYear() === printYear;
          return d.getFullYear() === printYear && d.getMonth() === monthIndex;
        });
        
        // 이미지 크기 초기화 (각 사진별 개별 크기)
        const sizes = {};
        filtered.forEach((issue, idx) => {
          sizes[issue.id] = { 
            before0Size: 100, before1Size: 100, 
            after0Size: 100, after1Size: 100 
          };
        });
        setImageSizes(sizes);
        setPreviewIssues(filtered);
        setCurrentPreviewPage(0);
        setShowPrintModal(false);
        setShowPreview(true);
      };

      const updateImageSize = (issueId, type, value) => {
        setImageSizes(prev => ({
          ...prev,
          [issueId]: {
            ...prev[issueId],
            [type]: parseInt(value)
          }
        }));
      };

      // 이미지 리사이즈 시작
      const handleResizeStart = (e, issueId, type, photoIdx) => {
        e.preventDefault();
        e.stopPropagation();
        const sizeKey = type + photoIdx + 'Size';
        const currentSize = imageSizes[issueId]?.[sizeKey] || 100;
        setResizingImage({ issueId, type, photoIdx, sizeKey });
        setResizeStart({ x: e.clientX, y: e.clientY, size: currentSize });
      };

      // 이미지 리사이즈 중
      const handleResizeMove = (e) => {
        if (!resizingImage) return;
        const deltaX = e.clientX - resizeStart.x;
        const deltaY = e.clientY - resizeStart.y;
        const delta = Math.max(deltaX, deltaY);
        const newSize = Math.min(250, Math.max(20, resizeStart.size + delta / 2));
        setImageSizes(prev => ({
          ...prev,
          [resizingImage.issueId]: {
            ...prev[resizingImage.issueId],
            [resizingImage.sizeKey]: Math.round(newSize)
          }
        }));
      };

      // 이미지 리사이즈 종료
      const handleResizeEnd = () => {
        setResizingImage(null);
      };

            const issueCanvas = await html2canvas(issueElement, {
              scale: 2,
              useCORS: true,
              backgroundColor: '#ffffff'
            });
            
            const issueImg = issueCanvas.toDataURL('image/png');
            const issueImgWidth = pageWidth - 10;
            const issueImgHeight = (issueCanvas.height * issueImgWidth) / issueCanvas.width;
            doc.addImage(issueImg, 'PNG', 5, 5, issueImgWidth, Math.min(issueImgHeight, pageHeight - 10));
          }

          doc.save('Gemba_Walk_Report_' + printYear + '_' + printMonth + '.pdf');
        } catch (error) {
          console.error('PDF 생성 오류:', error);
          alert('PDF 생성 중 오류가 발생했습니다.');

                    const baseSize = 280;
                    
                    if (photos.length === 1) {

                            </div>
                          </div>
                        </div>

                        </table>
                        
                        <div style={{ textAlign: 'right', marginTop: 16, fontSize: 13, color: '#6b7280' }}>{idx + 2}</div>
                      </div>
                    </div>
                  );
                })}
                
                {previewIssues.length === 0 && (
                  <div style={{ background: 'white', width: 950, padding: 60, borderRadius: 4, textAlign: 'center', color: '#666' }}>
                    해당 기간에 등록된 이슈가 없습니다.
                  </div>
                )}
                
                <div style={{ height: 40 }} />
              </div>
            </div>
          )}

          {/* 이미지 뷰어 모달 */}
          {viewerImage && (
            <div 
              style={{ 
                position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, 
                background: 'rgba(0,0,0,0.95)', 
                display: 'flex', alignItems: 'center', justifyContent: 'center', 
                zIndex: 9999,
                cursor: 'zoom-out'
              }} 
              onClick={() => setViewerImage(null)}
            >
              <button 
                onClick={() => setViewerImage(null)}
                style={{ 
                  position: 'absolute', top: 20, right: 20, 
                  background: 'rgba(255,255,255,0.2)', border: 'none', 
                  color: 'white', fontSize: 24, width: 50, height: 50, 
                  borderRadius: '50%', cursor: 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center'
                }}
              >
                ✕
              </button>
              <img 
                src={viewerImage} 
                style={{ 
                  maxWidth: '90vw', maxHeight: '90vh', 
                  objectFit: 'contain', 
                  borderRadius: 8,
                  boxShadow: '0 4px 30px rgba(0,0,0,0.5)'
                }} 
                alt="" 
                onClick={(e) => e.stopPropagation()}
              />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<GembaWalk />, document.getElementById('root'));
  </script>
</body>
</html>
